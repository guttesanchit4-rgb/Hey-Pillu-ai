name: Build Hey Pillu AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la
          echo "Checking Android Gradle project..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew || echo "Gradle wrapper is missing"

      - name: Build APK
        run: |
          echo "Android project files must be in the correct folders before building."
          echo "This workflow currently checks the project; a complete APK build needs the full Android project."
